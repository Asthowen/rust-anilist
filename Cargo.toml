[package]
name = "anilist"
version = "0.1.0"
authors = ["Asthowen<contact@asthowen.fr>"]
edition = "2024"
description = "rust-anilist is a Rust client wrapper for AniList API."
repository = "https://github.com/Asthowen/rust-anilist"
readme = "README.md"
homepage = "https://github.com/Asthowen"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"